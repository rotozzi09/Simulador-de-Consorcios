<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1c38"/>
      <stop offset="100%" stop-color="#152b52"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect x="32" y="32" width="448" height="448" rx="96" fill="none" stroke="#fbbf24" stroke-width="12" stroke-opacity="0.4"/>
  
  <!-- Calculator Outline -->
  <rect x="116" y="96" width="280" height="320" rx="36" fill="#102344" stroke="url(#gold)" stroke-width="16"/>
  
  <!-- Screen -->
