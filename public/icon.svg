  <text x="344" y="182" fill="#fbbf24" font-family="monospace" font-size="36" font-weight="bold" text-anchor="end">R$ 90K</text>
  
  <!-- Keys Grid -->
  <!-- Row 1 -->
  <rect x="148" y="228" width="56" height="44" rx="12" fill="#1b3664"/>
  <rect x="228" y="228" width="56" height="44" rx="12" fill="#1b3664"/>
  <rect x="308" y="228" width="56" height="44" rx="12" fill="url(#gold)"/>
  
  <!-- Row 2 -->
  <rect x="148" y="292" width="56" height="44" rx="12" fill="#1b3664"/>
  <rect x="228" y="292" width="56" height="44" rx="12" fill="#1b3664"/>
  <rect x="308" y="292" width="56" height="44" rx="12" fill="#10b981"/>
  
  <!-- Row 3 -->
  <rect x="148" y="356" width="136" height="44" rx="12" fill="#1b3664"/>
  <rect x="308" y="356" width="56" height="44" rx="12" fill="#10b981"/>
  
  <!-- Sparkle Accent -->
  <path d="M 400 70 Q 400 100 430 100 Q 400 100 400 130 Q 400 100 370 100 Q 400 100 400 70 Z" fill="#fbbf24"/>
